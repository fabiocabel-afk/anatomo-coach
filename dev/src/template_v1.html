<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#642A90">
<title>Corpo 3D — Exercícios</title>
<!--PWA_HEAD-->
<style>
:root{--roxo:#642A90;--bg:#F4F1F7;--card:#fff;--tx:#1F1A26;--tx2:#6B6475;--bd:#E4DDEC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 4px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:19px;margin:0;font-weight:600;color:var(--roxo)}
header span{font-size:12px;color:var(--tx2)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
#view{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--tx2);background:rgba(255,255,255,.85);padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#fab{position:absolute;right:12px;top:10px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--roxo);padding:0;flex:none}
.ic svg{width:22px;height:22px}
#panel{background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px)}
#nome{font-size:17px;font-weight:600;margin:0}
#desc{font-size:13px;color:var(--tx2);margin:4px 0 10px;line-height:1.45}
#mus{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:24px}
.m{font-size:12px;padding:4px 10px;border-radius:999px}
.m.p{background:#FDE3EE;color:#A3164F}
.m.s{background:#FFEBD0;color:#8A4A00}
.row{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 11px;font-size:13px;color:var(--tx2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--roxo);color:#fff}
#reps{font-size:13px;color:var(--tx2);margin-left:auto;white-space:nowrap}
#reps b{font-size:21px;color:var(--tx);font-weight:600;margin-left:4px}
.lg{display:flex;gap:12px;font-size:11px;color:var(--tx2);margin-top:10px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<header><h1>Corpo 3D</h1><span>biblioteca de exercícios · v1</span></header>
<div id="chips"></div>
<div id="view">
  <div id="fab"><button class="ic" id="bBest" aria-label="Voltar ao melhor ângulo" title="Melhor ângulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
  <div id="hint">Arraste para girar · pinça para zoom</div>
</div>
<div id="panel">
  <p id="nome"></p>
  <p id="desc"></p>
  <div id="mus"></div>
  <div class="row">
    <button class="ic" id="bPlay" aria-label="Pausar"></button>
    <div class="seg" id="spd"><button data-v="1.45">Lento</button><button data-v="1" class="on">Normal</button><button data-v="0.7">Rápido</button></div>
    <div id="reps">Reps<b id="nReps">0</b></div>
  </div>
  <div class="lg"><span><i style="background:#EC357D"></i>Músculo principal</span><span><i style="background:#FF9901"></i>Auxiliar</span></div>
</div>
<script>/*THREE*/</script>
<script>/*APP*/</script>
<!--PWA_SW-->
</body>
</html>
